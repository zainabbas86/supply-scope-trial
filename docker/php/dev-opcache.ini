; Development only. Mounted into the web and worker containers by
; docker-compose.override.yml; never part of the image.
;
; The image sets opcache.validate_timestamps = 0, which is correct for a
; deployment: the code in an immutable image cannot change at runtime, so
; stat()-ing every file on every request buys nothing.
;
; In development it silently breaks the whole point of the bind mounts. PHP
; compiles a file once and then serves the cached bytecode forever, so an edit
; to a controller, a route file or a config is invisible until the container is
; restarted — while `php artisan` in the same container shows the new code,
; because opcache.enable_cli is 0. That divergence is genuinely confusing:
; route:list is right and the browser is wrong.
;
; Filename starts with zz- so conf.d loads it AFTER opcache.ini and wins.

opcache.validate_timestamps = 1

; Re-stat on every request. The default of 2 seconds is fine for a busy server
; and merely annoying on a laptop, where the file you just saved is the one you
; are about to reload.
opcache.revalidate_freq = 0
