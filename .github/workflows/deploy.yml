name: Deploy

# =============================================================================
# Three environments: uat, staging, production.
#
# They differ ONLY in configuration. There is one image, built once and promoted
# unchanged — the same artifact that passed CI is the artifact that reaches
# production. Rebuilding per environment would mean the thing you tested is not
# the thing you shipped.
#
# HONEST STATUS: nothing is hosted yet. Everything up to and including "publish
# the image" runs for real today. The `Release` step in each environment is the
# single place a host command goes, and it is deliberately left as one explicit
# line rather than a plausible-looking script that does nothing — a deploy that
# silently succeeds without deploying is worse than one that is obviously
# unwired.
# =============================================================================

on:
    workflow_dispatch:
        inputs:
            environment:
                description: Target environment
                required: true
                default: uat
                type: choice
                options: [uat, staging, production]

    # A version tag deploys production. Tagging is a deliberate act; pushing to
    # a branch is not, and production should not move because someone merged.
    push:
        tags: ['v*']

concurrency:
    # One deploy per environment at a time, and NOT cancel-in-progress: killing
    # a half-finished migration is worse than waiting for it.
    group: deploy-${{ inputs.environment || 'production' }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE: ${{ github.repository }}

jobs:
    build:
        name: Build and publish image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        outputs:
            digest: ${{ steps.push.outputs.digest }}
            tag: ${{ steps.meta.outputs.version }}

        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
                  tags: |
                      type=ref,event=tag
                      type=sha,format=long

            - id: push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: runtime
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy to ${{ inputs.environment || 'production' }}
        needs: build
        runs-on: ubuntu-latest

        # GitHub Environments are doing real work here, not decoration:
        #   - secrets are scoped per environment, so a UAT credential cannot be
        #     read by a production job and vice versa;
        #   - `production` can require a reviewer before the job starts;
        #   - each deploy is recorded against its environment.
        # Configure protection rules in Settings → Environments.
        environment:
            name: ${{ inputs.environment || 'production' }}
            url: ${{ vars.APP_URL }}

        steps:
            - uses: actions/checkout@v4

            - name: Show what is being deployed
              run: |
                  echo "environment : ${{ inputs.environment || 'production' }}"
                  echo "image       : ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.build.outputs.tag }}"
                  echo "digest      : ${{ needs.build.outputs.digest }}"

            # -----------------------------------------------------------------
            # Release steps, in the order they must run.
            #
            # Migrations run ONCE, as a release command, before the new image
            # takes traffic — never on container boot, which races across
            # replicas. `app:ensure-admin` is idempotent and safe to re-run.
            #
            # The one line to fill in per host:
            #   Fly.io    flyctl deploy --image $IMAGE --app $FLY_APP
            #   Render    curl -X POST "$RENDER_DEPLOY_HOOK"
            #   Cloud Run gcloud run deploy $SERVICE --image $IMAGE
            #
            # Every secret is read from the GitHub ENVIRONMENT, not the repo and
            # not `.env.example`.
            #
            # That is what makes uat, staging and production independent: each
            # holds its own credentials, each can be rotated without touching
            # the code, and a UAT credential is unreadable from a production job.
            #
            # Required per environment (Settings → Environments → Secrets):
            #   APP_KEY  DB_PASSWORD  REDIS_PASSWORD  OPENAI_API_KEY
            #   ADMIN_PASSWORD  DEPLOY_TOKEN
            #
            # ADMIN_PASSWORD is passed through to `app:ensure-admin`, which is
            # idempotent — so rotating a password is: change the secret, re-run
            # this workflow. There is deliberately no in-app password change;
            # the account is provisioned, not self-managed.
            # -----------------------------------------------------------------
            - name: Release
              env:
                  IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
                  DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
                  APP_KEY: ${{ secrets.APP_KEY }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

                  # ---------------------------------------------------------
                  # VARIABLES, not secrets: non-sensitive config that differs
                  # per environment. Visible in run logs, which is exactly what
                  # you want when diagnosing "why did production behave
                  # differently" — a masked value tells you nothing.
                  #
                  # The test is not "is this config?" but "would seeing it in a
                  # log matter?". Anything IDENTICAL across environments belongs
                  # in config/ or .env.example instead: putting it here creates
                  # three copies that drift.
                  # ---------------------------------------------------------
                  APP_ENV: ${{ vars.APP_ENV }}
                  APP_URL: ${{ vars.APP_URL }}
                  APP_DEBUG: ${{ vars.APP_DEBUG }}
                  LOG_LEVEL: ${{ vars.LOG_LEVEL }}

                  DB_HOST: ${{ vars.DB_HOST }}
                  DB_PORT: ${{ vars.DB_PORT }}
                  DB_DATABASE: ${{ vars.DB_DATABASE }}
                  DB_USERNAME: ${{ vars.DB_USERNAME }}

                  REDIS_HOST: ${{ vars.REDIS_HOST }}
                  REDIS_PORT: ${{ vars.REDIS_PORT }}

                  # Object storage in a deployment; a shared volume only locally.
                  FILESYSTEM_DISK: ${{ vars.FILESYSTEM_DISK }}
                  AWS_BUCKET: ${{ vars.AWS_BUCKET }}
                  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}

                  OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

                  # Deliberately per-environment: a low ceiling in uat means a
                  # runaway test cannot spend production's budget.
                  EXTRACTION_DAILY_LIMIT: ${{ vars.EXTRACTION_DAILY_LIMIT }}
              run: |
                  # Fail before touching the host if a secret is missing, rather
                  # than deploying an app that cannot boot or has no way in.
                  # `[ -z "$x" ] && assign` would abort the step the moment a
                  # secret IS present: the test returns non-zero, and Actions
                  # runs every step under `bash -e`. An explicit `if` is the
                  # difference between a check and a landmine.
                  #
                  # ${!v} is bash indirect expansion — no eval, so a secret
                  # containing shell metacharacters cannot be executed.
                  missing=""
                  for v in APP_KEY DB_PASSWORD REDIS_PASSWORD OPENAI_API_KEY ADMIN_PASSWORD; do
                    if [ -z "${!v}" ]; then
                      missing="$missing $v"
                    fi
                  done

                  if [ -n "$missing" ]; then
                    echo "::error::Missing secrets for this environment:$missing"
                    echo "Set them under Settings → Environments → ${{ inputs.environment || 'production' }}."
                    exit 1
                  fi

                  if [ -z "${DEPLOY_TOKEN}" ]; then
                    echo "::error::No DEPLOY_TOKEN configured for this environment."
                    echo "The image is published and ready at: ${IMAGE}"
                    echo "Add the host command to this step and set DEPLOY_TOKEN"
                    echo "under Settings → Environments to complete the deploy."
                    exit 1
                  fi

                  echo "::error::Deploy target not yet configured."
                  echo "Add the provider command for this environment here."
                  exit 1

            # Runs only once the Release step above is wired up and succeeds.
            - name: Smoke test
              if: success()
              run: |
                  # A deploy that reports success without the app answering is
                  # not a success. /up is Laravel's health endpoint.
                  curl --fail --silent --show-error --retry 5 --retry-delay 5 \
                       "${{ vars.APP_URL }}/up"
